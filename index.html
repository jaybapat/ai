<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi-Model Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #050906;
      --surface: #0b120d;
      --surface-raised: #101a12;
      --line: #243d2a;
      --green: #73ff85;
      --text: #e0f0e2;
      --mono: "DM Mono", "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    body {
      position: relative;
      isolation: isolate;
      font-family: var(--mono);
      color: var(--text);
      background: var(--bg);
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      margin-inline: auto;
      padding: 20px;
      gap: 14px;
    }
    body::before {
      content: "01001000 01000001 01000011 01001011 00100000 01010100 01001000 01000101 00100000 01010000 01001100 01000001 01001110 01000101 01010100";
      position: fixed;
      inset: 0 0 0 auto;
      z-index: -1;
      width: min(100vw, 900px);
      overflow: hidden;
      color: var(--green);
      opacity: 0.045;
      font: 500 11px/2 var(--mono);
      letter-spacing: 0.35em;
      overflow-wrap: anywhere;
      pointer-events: none;
      animation: binary-drift 24s linear infinite;
    }
    @keyframes binary-drift {
      from { transform: translateY(-12px); }
      to { transform: translateY(12px); }
    }
    header { display: flex; gap: 10px; }
    #model, textarea, button {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text);
      font: 14px var(--mono);
      transition: border-color 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }
    #model { flex: 1; min-width: 0; padding: 11px 12px; }
    #model::placeholder, textarea::placeholder { color: #738b77; }
    #chat {
      flex: 1;
      min-height: 180px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(135deg, rgba(10, 19, 12, 0.96), rgba(5, 9, 6, 0.96));
      box-shadow: inset 0 0 30px rgba(28, 75, 36, 0.08);
      scrollbar-color: #355b3b var(--surface);
    }
    #chat:empty::before {
      content: "// secure channel open | awaiting input";
      margin: auto;
      color: #607664;
      font-size: 12px;
    }
    .msg {
      max-width: 85%;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 4px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }
    .user { align-self: flex-end; border-color: #397444; background: #102116; }
    .assistant { align-self: flex-start; background: var(--surface-raised); }
    .tag {
      margin-bottom: 6px;
      color: var(--green);
      font: 600 10px "Orbitron", var(--mono);
      overflow-wrap: anywhere;
    }
    .error { align-self: center; color: #ff8585; font-size: 13px; }
    form { display: flex; gap: 10px; }
    textarea { flex: 1; min-width: 0; padding: 11px 12px; resize: vertical; line-height: 1.5; }
    button { padding: 9px 15px; cursor: pointer; }
    #send {
      border-color: var(--green);
      background: var(--green);
      color: #061008;
      font-weight: 500;
    }
    button:hover:not(:disabled) { border-color: var(--green); box-shadow: 0 0 14px rgba(115, 255, 133, 0.14); }
    #send:hover:not(:disabled) { background: #a0ffab; }
    button:disabled { cursor: wait; opacity: 0.55; }
    :is(#model, textarea, button):focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
    ::selection { background: var(--green); color: #061008; }
    @media (max-width: 520px) {
      body { padding: 12px; gap: 10px; }
      #chat { padding: 12px; }
      .msg { max-width: 94%; }
      header, form { gap: 7px; }
      button { padding-inline: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header>
    <input id="model" list="models" placeholder="Pick a model">
    <datalist id="models"></datalist>
    <button id="reset" type="button">New chat</button>
  </header>

  <div id="chat"></div>

  <form id="form">
    <textarea id="prompt" rows="2" placeholder="Type a message (Enter to send, Shift+Enter for a new line)"></textarea>
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const API = "https://ai-three-fawn-59.vercel.app";
    const HISTORY_KEY = "mm-chat-history";
    const MODEL_KEY = "mm-chat-model";
    const MAX_SENT = 20; // only the last 20 messages go to the API, to save credits

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const promptEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");
    const modelEl = document.getElementById("model");
    const datalist = document.getElementById("models");

    function load(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v ? JSON.parse(v) : fallback;
      } catch { return fallback; }
    }
    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    }

    let history = load(HISTORY_KEY, []);
    modelEl.value = load(MODEL_KEY, "");

    function addBubble(role, text, model) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      if (role === "assistant" && model) {
        const tag = document.createElement("div");
        tag.className = "tag";
        tag.textContent = model;
        div.appendChild(tag);
      }
      const body = document.createElement("div");
      body.textContent = text;
      div.appendChild(body);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function showError(text) {
      const div = document.createElement("div");
      div.className = "error";
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function render() {
      chat.replaceChildren();
      history.forEach((m) => addBubble(m.role, m.content, m.model));
    }

    async function loadModels() {
      try {
        const r = await fetch(API + "/api/models");
        const { models } = await r.json();
        models.forEach((id) => datalist.appendChild(new Option(id)));
        if (!modelEl.value && models.length) modelEl.value = models[0];
      } catch {
        showError("Couldn't load the model list.");
      }
    }

    modelEl.addEventListener("change", () => save(MODEL_KEY, modelEl.value.trim()));

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = promptEl.value.trim();
      const model = modelEl.value.trim();
      if (!text) return;
      if (!model) return showError("Pick a model first.");
      save(MODEL_KEY, model);

      history.push({ role: "user", content: text });
      save(HISTORY_KEY, history);
      addBubble("user", text);
      promptEl.value = "";
      sendBtn.disabled = true;

      try {
        const messages = history.slice(-MAX_SENT).map(({ role, content }) => ({ role, content }));
        const r = await fetch(API + "/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ model, messages }),
        });
        const data = await r.json();
        const reply = data.choices?.[0]?.message?.content;
        if (!reply) throw new Error(data.error?.message || data.error || "No response from the model");

        history.push({ role: "assistant", content: reply, model });
        save(HISTORY_KEY, history);
        addBubble("assistant", reply, model);
      } catch (err) {
        // roll back the failed message so history stays clean, and restore the text
        history.pop();
        save(HISTORY_KEY, history);
        render();
        promptEl.value = text;
        showError("Error: " + err.message);
      } finally {
        sendBtn.disabled = false;
        promptEl.focus();
      }
    });

    promptEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    document.getElementById("reset").addEventListener("click", () => {
      if (!confirm("Clear this conversation?")) return;
      history = [];
      save(HISTORY_KEY, history);
      render();
    });

    render();
    loadModels();
  </script>
</body>
</html>
